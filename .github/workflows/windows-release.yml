name: Windows release package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-release.yml"
      - "tools/New-WindowsReleasePackage.ps1"
      - "src/Qcow2Explorer/**"
      - "README.md"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Qcow2Explorer.sln --runtime win-x64

      - name: Build release configuration
        run: dotnet build Qcow2Explorer.sln --configuration Release --no-restore

      - name: Run generated-image tests
        run: dotnet run --project tests\Qcow2Explorer.Tests\Qcow2Explorer.Tests.csproj --configuration Release --no-build

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v(.+)$') {
            "value=$($Matches[1])" >> $env:GITHUB_OUTPUT
          } else {
            "value=0.0.0-ci.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
          }

      - name: Create self-contained package
        shell: pwsh
        run: >-
          .\tools\New-WindowsReleasePackage.ps1
          -OutputDirectory .\artifacts
          -Version "${{ steps.version.outputs.value }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualDisk-Tools-win-x64
          path: |
            artifacts/VirtualDisk-Tools-win-x64.zip
            artifacts/VirtualDisk-Tools-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: VirtualDisk-Tools-win-x64
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/VirtualDisk-Tools-win-x64.zip \
            artifacts/VirtualDisk-Tools-win-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
