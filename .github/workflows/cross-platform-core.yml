name: Cross-platform core

on:
  push:
    branches: [main, feature/cross-platform-core]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Linux interoperability tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xfsprogs

      - name: Restore core projects
        run: dotnet restore src/VirtualDisk.Cli/VirtualDisk.Cli.csproj

      - name: Build core projects
        run: dotnet build src/VirtualDisk.Cli/VirtualDisk.Cli.csproj --configuration Release --no-restore

      - name: Restore cross-platform GUI
        run: dotnet restore src/VirtualDisk.Gui/VirtualDisk.Gui.csproj

      - name: Build cross-platform GUI
        run: dotnet build src/VirtualDisk.Gui/VirtualDisk.Gui.csproj --configuration Release --no-restore

      - name: Restore core tests
        run: dotnet restore tests/VirtualDisk.Core.Tests/VirtualDisk.Core.Tests.csproj

      - name: Build core tests
        run: dotnet build tests/VirtualDisk.Core.Tests/VirtualDisk.Core.Tests.csproj --configuration Release --no-restore

      - name: Run core tests
        run: dotnet run --project tests/VirtualDisk.Core.Tests/VirtualDisk.Core.Tests.csproj --configuration Release --no-build

      - name: Run CLI smoke test
        run: dotnet run --project src/VirtualDisk.Cli/VirtualDisk.Cli.csproj --configuration Release --no-build -- --help

      - name: Validate managed XFS with xfsprogs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf 'Cross-platform initial file\n' > /tmp/vdt-ci-seed.txt
          dotnet run --project src/VirtualDisk.Cli/VirtualDisk.Cli.csproj --configuration Release --no-build -- \
            create /tmp/vdt-ci-xfs.raw --size 512MiB --table gpt --partition xfs:320MiB:VDT_XFS \
            --initial-file 1=/tmp/vdt-ci-seed.txt
          dd if=/tmp/vdt-ci-xfs.raw of=/tmp/vdt-ci-xfs.partition bs=512 skip=2048 count=655360 status=none
          xfs_repair -n /tmp/vdt-ci-xfs.partition
          dotnet run --project src/VirtualDisk.Cli/VirtualDisk.Cli.csproj --configuration Release --no-build -- \
            list /tmp/vdt-ci-xfs.raw --partition 1 --path / | grep VDT-README.txt
          dotnet run --project src/VirtualDisk.Cli/VirtualDisk.Cli.csproj --configuration Release --no-build -- \
            verify /tmp/vdt-ci-xfs.raw --partition 1 --path / | grep "Verification passed"
          dotnet run --project src/VirtualDisk.Cli/VirtualDisk.Cli.csproj --configuration Release --no-build -- \
            extract /tmp/vdt-ci-xfs.raw --partition 1 --path /VDT-README.txt --output /tmp/vdt-ci-readme.txt
          grep -q "Created by Virtual Disk Explorer" /tmp/vdt-ci-readme.txt
          dotnet run --project src/VirtualDisk.Cli/VirtualDisk.Cli.csproj --configuration Release --no-build -- \
            extract /tmp/vdt-ci-xfs.raw --partition 1 --path / --output /tmp/vdt-ci-root
          grep -q "Created by Virtual Disk Explorer" /tmp/vdt-ci-root/VDT-README.txt
          cmp /tmp/vdt-ci-seed.txt /tmp/vdt-ci-root/vdt-ci-seed.txt
          if dotnet run --project src/VirtualDisk.Cli/VirtualDisk.Cli.csproj --configuration Release --no-build -- \
            create /tmp/vdt-invalid.raw --size invalid --partition ext4:64MiB; then
            echo "Invalid CLI size was unexpectedly accepted."
            exit 1
          fi
          test ! -e /tmp/vdt-invalid.raw
          rm -rf /tmp/vdt-ci-root
          rm -f /tmp/vdt-ci-xfs.raw /tmp/vdt-ci-xfs.partition /tmp/vdt-ci-readme.txt /tmp/vdt-ci-seed.txt

      - name: Run GUI entry-point smoke test
        run: dotnet run --project src/VirtualDisk.Gui/VirtualDisk.Gui.csproj --configuration Release --no-build -- --version
